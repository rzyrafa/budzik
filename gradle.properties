# JetBrains Runtime bundled with Android Studio (reinstalled on X:)
org.gradle.java.home=X:\\Emulator\\jbr

# JVM Heap & Encoding
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

